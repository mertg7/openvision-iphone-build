          +import Foundation
          +import CoreLocation
          +import AVFoundation
          +
          +/// A walk is explicitly started and never restored after launch. No route is stored.
          +@MainActor
          +final class CityGuideService: NSObject, ObservableObject, CLLocationManagerDelegate, AVSpeechSynthesizerDelegate {
          +    static let shared = CityGuideService()
          +    @Published private(set) var isActive = false
          +    @Published private(set) var isSpeaking = false
          +    @Published private(set) var places: [GuidePlace] = []
          +    @Published private(set) var status = "Geziyi başlatınca yakındaki yerler burada görünür."
          +    @Published private(set) var accuracy: Double?
          +    var canNarrate: (() -> Bool)?
          +    /// Existing live conversations speak with their own voice and retain server barge-in.
          +    var narrateWithAssistant: ((String) async throws -> Bool)?
          +    private lazy var location = CLLocationManager()
          +    private let speech = AVSpeechSynthesizer()
          +    private var policy = GuidePolicy()
          +    private var fix: CLLocation?
          +    private var lastSearchFix: CLLocation?
          +    private var lastSearchAt = Date.distantPast
          +    private var searchTask: Task<Void, Never>?
          +    private var narrationTask: Task<Void, Never>?
          +    private var isRequestingNarration = false
          +    private var narrationID = UUID()
          +    private var sessionID = UUID()
          +    private override init() {
          +        super.init()
          +        speech.delegate = self
          +    }
          +
          +    func start() {
          +        guard !isActive, !AppLaunchConfiguration.isTesting else { return }
          +        isActive = true
          +        sessionID = UUID()
          +        policy.reset()
          +        places = []
          +        lastSearchFix = nil
          +        lastSearchAt = .distantPast
          +        location.delegate = self
          +        location.desiredAccuracy = kCLLocationAccuracyNearestTenMeters
          +        location.distanceFilter = 30
          +        location.activityType = .fitness
          +        location.pausesLocationUpdatesAutomatically = true
          +        updateAuthorization()
          +    }
          +
          +    func stop() {
          +        isActive = false
          +        sessionID = UUID()
          +        searchTask?.cancel()
          +        searchTask = nil
          +        location.stopUpdatingLocation()
          +        location.allowsBackgroundLocationUpdates = false
          +        stopSpeaking()
          +        fix = nil
          +        accuracy = nil
          +        places = []
          +        policy.reset()
          +        status = "Gezi durduruldu. Konum takibi kapalı."
          +    }
          +
          +    func stopSpeaking() {
          +        narrationID = UUID()
          +        narrationTask?.cancel()
          +        narrationTask = nil
          +        isRequestingNarration = false
          +        stopLocalSpeech()
          +    }
          +
          +    func stopLocalSpeech() {
          +        speech.stopSpeaking(at: .immediate)
          +        isSpeaking = false
          +    }
          +
          +    private func updateAuthorization() {
          +        guard isActive else { return }
          +        switch location.authorizationStatus {
          +        case .notDetermined:
          +            status = "Rehber için iPhone’un konum iznini bekliyorum."
          +            location.requestWhenInUseAuthorization()
          +        case .authorizedAlways, .authorizedWhenInUse:
          +            // Info.plist declares location. Enabled only for an explicitly active walk.
          +            location.allowsBackgroundLocationUpdates = true
          +            location.showsBackgroundLocationIndicator = true
          +            location.startUpdatingLocation()
          +            status = "Güncel konum bekleniyor."
          +        case .denied, .restricted:
          +            isActive = false
          +            sessionID = UUID()
          +            searchTask?.cancel()
          +            searchTask = nil
          +            status = "Konum izni kapalı. iPhone Ayarları → OpenVision → Konum’dan izin verebilirsin."
          +            location.stopUpdatingLocation()
          +            location.allowsBackgroundLocationUpdates = false
          +            stopSpeaking()
          +            places = []
          +            fix = nil
          +            accuracy = nil
          +        @unknown default:
          +            status = "Konum izni alınamadı."
          +        }
          +    }
          +    func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) { updateAuthorization() }
          +    func locationManager(_ manager: CLLocationManager, didFailWithError error: Error) {
          +        guard isActive else { return }
          +        status = "Konum alınamadı. Yakındaki yerleri tahmin etmiyorum."
          +    }
          +    func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
          +        guard isActive, let latest = locations.last else { return }
          +        accuracy = latest.horizontalAccuracy
          +        guard GuidePolicy.acceptsFix(age: Date().timeIntervalSince(latest.timestamp), accuracy: latest.horizontalAccuracy, speed: latest.speed) else {
          +            status = "Konum hassas değil veya yürüyüş hızı aşıldı. Otomatik anlatım bekliyor."
          +            fix = nil
          +            return
          +        }
          +        fix = latest
          +        narrateNearbyIfPossible()
          +        let moved = lastSearchFix.map { latest.distance(from: $0) >= 100 } ?? true
          +        guard searchTask == nil, moved || Date().timeIntervalSince(lastSearchAt) >= 90 else { return }
          +        refresh(around: latest)
          +    }
          +
          +    private func refresh(around center: CLLocation) {
          +        let token = sessionID
          +        lastSearchAt = Date()
          +        lastSearchFix = center
          +        status = "Yakındaki Türkçe kaynaklar aranıyor…"
          +        searchTask = Task { [weak self] in
          +            do {
          +                var url = URLComponents(string: "https://tr.wikipedia.org/w/api.php")!
          +                let parameters = ["action":"query", "format":"json", "formatversion":"2",
          +                    "generator":"geosearch", "ggscoord":"\(center.coordinate.latitude)|\(center.coordinate.longitude)",
          +                    "ggsradius":"1000", "ggslimit":"10", "ggsnamespace":"0",
          +                    "prop":"coordinates|extracts", "exintro":"1", "explaintext":"1", "exchars":"650", "exlimit":"10"]
          +                url.queryItems = parameters.sorted { $0.key < $1.key }.map { URLQueryItem(name: $0.key, value: $0.value) }
          +                var request = URLRequest(url: url.url!, timeoutInterval: 12)
          +                request.setValue("OpenVisionCityGuide/3.0 (https://github.com/rayl15/OpenVision)", forHTTPHeaderField: "User-Agent")
          +                let (data, response) = try await URLSession.shared.data(for: request)
          +                try Task.checkCancellation()
          +                guard let http = response as? HTTPURLResponse, http.statusCode == 200, data.count <= 1_000_000 else {
          +                    throw URLError(.badServerResponse)
          +                }
          +                let results = try GuideSourceParser.places(from: data)
          +                guard let self, self.isActive, self.sessionID == token else { return }
          +                self.places = results.filter { self.distance(to: $0).map { $0 <= 1000 } ?? false }
          +                    .sorted { (self.distance(to: $0) ?? .infinity) < (self.distance(to: $1) ?? .infinity) }
          +                self.status = self.places.isEmpty ? "Yakında Türkçe kaynak bulunamadı. Yer veya tarih bilgisi uydurmuyorum." : "Kaynak: Türkçe Wikipedia. Konum hangi yöne baktığını göstermez."
          +                self.searchTask = nil
          +                self.narrateNearbyIfPossible()
          +            } catch {
          +                guard let self, self.isActive, self.sessionID == token, !Task.isCancelled else { return }
          +                self.searchTask = nil
          +                self.status = "Rehber kaynağına ulaşılamadı. İnternet bağlantısını kontrol et."
          +            }
          +        }
          +    }
          +
          +    func distance(to place: GuidePlace) -> Double? {
          +        guard let fix, GuidePolicy.acceptsFix(age: Date().timeIntervalSince(fix.timestamp), accuracy: fix.horizontalAccuracy, speed: fix.speed) else { return nil }
          +        return fix.distance(from: CLLocation(latitude: place.latitude, longitude: place.longitude))
          +    }
          +
          +    private func narrateNearbyIfPossible() {
          +        guard SettingsManager.shared.settings.guideAutomaticNarration else { return }
          +        guard let nearest = places.first(where: {
          +            policy.mayNarrate(id: $0.id, distance: distance(to: $0) ?? .infinity, now: Date(), busy: isSpeaking || isRequestingNarration || canNarrate?() != true)
          +        }) else { return }
          +        narrate(nearest)
          +    }
          +
          +    func narrate(_ place: GuidePlace) {
          +        guard isActive, let meters = distance(to: place), meters <= 1000 else {
          +            status = "Anlatım için güncel ve hassas bir konum gerekiyor."
          +            return
          +        }
          +        guard !isSpeaking, !isRequestingNarration, canNarrate?() == true else {
          +            status = "Asistan konuşması bitince yeniden anlatmayı deneyebilirsin."
          +            return
          +        }
          +        let rounded = Int((meters / 10).rounded()) * 10
          +        let spoken = "Yaklaşık \(rounded) metre yakınında \(place.title) var. Wikipedia’ya göre: \(place.summary)"
          +        let token = sessionID
          +        narrationID = UUID()
          +        let narrationToken = narrationID
          +        isRequestingNarration = true
          +        narrationTask = Task { [weak self] in
          +            guard let self else { return }
          +            defer {
          +                if self.sessionID == token, self.narrationID == narrationToken {
          +                    self.isRequestingNarration = false
          +                    self.narrationTask = nil
          +                }
          +            }
          +            do {
          +                let handled = try await self.narrateWithAssistant?(spoken) ?? false
          +                try Task.checkCancellation()
          +                guard self.isActive, self.sessionID == token, self.narrationID == narrationToken else { return }
          +                if handled {
          +                    self.policy.didNarrate(id: place.id, now: Date())
          +                    return
          +                }
          +                // Do not reconfigure an existing Bluetooth/microphone route.
          +                if AudioSessionManager.shared.currentMode == .inactive {
          +                    try AudioSessionManager.shared.configure(for: .measurement)
          +                }
          +                let utterance = AVSpeechUtterance(string: spoken)
          +                utterance.voice = AVSpeechSynthesisVoice(language: "tr-TR")
          +                utterance.rate = AVSpeechUtteranceDefaultSpeechRate
          +                self.isSpeaking = true
          +                self.speech.speak(utterance)
          +                self.policy.didNarrate(id: place.id, now: Date())
          +            } catch {
          +                guard self.isActive, self.sessionID == token, self.narrationID == narrationToken, !Task.isCancelled else { return }
          +                self.status = "Anlatım başlatılamadı. Yeniden deneyebilirsin."
          +            }
          +        }
          +    }
          +
          +    nonisolated func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didFinish utterance: AVSpeechUtterance) {
          +        Task { @MainActor [weak self] in
          +            guard let self else { return }
          +            self.isSpeaking = self.speech.isSpeaking
          +        }
          +    }
          +    nonisolated func speechSynthesizer(_ synthesizer: AVSpeechSynthesizer, didCancel utterance: AVSpeechUtterance) {
          +        Task { @MainActor [weak self] in
          +            guard let self else { return }
          +            self.isSpeaking = self.speech.isSpeaking
          +        }
          +    }
          +
          +    func context() -> String {
          +        guard isActive else { return "Canlı rehber kapalı. Rehber sekmesinden geziyi başlat. Kullanıcının konumunu tahmin etme." }
          +        let nearby = places.compactMap { place -> String? in
          +            guard let distance = distance(to: place), distance <= 1000 else { return nil }
          +            return "\(place.title), yaklaşık \(Int(distance)) metre: \(place.summary) Kaynak: \(place.sourceURL.absoluteString)"
          +        }
          +        guard !nearby.isEmpty else { return status + " Kullanıcının baktığı binayı veya tarihini tahmin etme." }
          +        return "Aşağıdakiler konuma yakın kaynak maddeleridir; kullanıcının baktığı yer kesin değildir. Güncel fiyat ve çalışma saati içermez. Türkçe, kısa cevap ver; yalnızca bu metindeki tarih bilgisine dayan.\n" + nearby.prefix(3).joined(separator: "\n")
          +    }
          +}
          +
          +struct CityGuideTool: NativeTool {
          +    let name = "city_guide"
          +    let description = "Get sourced Turkish information about places near the user's iPhone, only during an explicitly started city-guide walk. Use for 'burayı anlat', nearby sights, history, and city-guide questions. Never infer the user's view from GPS."
          +    let parametersSchema: [String: Any] = ["type":"object", "properties":[
          +        "action": ["type":"string", "enum":["context", "stop"], "description":"context: nearby sourced facts; stop: stop the walk and location tracking"]], "required":[]]
          +    func execute(args: [String: Any]) async throws -> String {
          +        if args["action"] as? String == "stop" {
          +            await CityGuideService.shared.stop()
          +            return "Gezi durduruldu. Konum takibi kapalı."
          +        }
          +        return await CityGuideService.shared.context()
          +    }
          +}
