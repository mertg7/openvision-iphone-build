          +import AVFoundation
          +import Foundation
          +
          +/// One hardware tap, with a replaceable consumer. Swapping wake/live consumers
          +/// must not stop the microphone that was started while the app was foreground.
          +final class MicrophoneInputRouter: @unchecked Sendable {
          +    // Audio callbacks run off the UI actor; do not inherit its isolation at creation.
          +    typealias Sink = @Sendable (AVAudioPCMBuffer) -> Void
          +    private let lock = NSLock()
          +    private var sink: Sink?
          +
          +    func setSink(_ sink: Sink?) {
          +        lock.lock()
          +        self.sink = sink
          +        lock.unlock()
          +    }
          +
          +    func deliver(_ buffer: AVAudioPCMBuffer) {
          +        lock.lock()
          +        let current = sink
          +        lock.unlock()
          +        current?(buffer)
          +    }
          +
          +    /// Copy samples before leaving the audio callback; AVAudioEngine reuses its buffer.
          +    static func monoSamples(from buffer: AVAudioPCMBuffer) -> [Float] {
          +        guard let channels = buffer.floatChannelData, buffer.frameLength > 0,
          +              buffer.format.channelCount > 0 else { return [] }
          +        let frames = Int(buffer.frameLength)
          +        let count = Int(buffer.format.channelCount)
          +        var result = [Float](repeating: 0, count: frames)
          +        for channel in 0..<count {
          +            for frame in 0..<frames {
          +                let value = buffer.format.isInterleaved
          +                    ? channels[0][frame * count + channel] : channels[channel][frame]
          +                result[frame] += value / Float(count)
          +            }
          +        }
          +        return result
          +    }
          +}
          --- /dev/null
          +++ b/OpenVision/Services/Audio/PCMCodec.swift
          @@ -0,0 +1,37 @@
          +import Foundation
          +
          +enum PCMCodec {
          +    static func decode(_ data: Data) -> [Float] {
          +        guard !data.isEmpty, data.count.isMultiple(of: 2) else { return [] }
          +        let bytes = Array(data)
          +        return stride(from: 0, to: bytes.count, by: 2).map { i in
          +            let bits = UInt16(bytes[i]) | (UInt16(bytes[i + 1]) << 8)
          +            return Float(Int16(bitPattern: bits)) / 32768
          +        }
          +    }
          +    static func encode(_ samples: [Float]) -> Data {
          +        var bytes = [UInt8]()
          +        bytes.reserveCapacity(samples.count * 2)
          +        for sample in samples {
          +            let safe = sample.isFinite ? max(-1, min(1, sample)) : 0
          +            let scaled = Int16(max(-32768, min(32767, Int(safe * 32768))))
          +            let bits = UInt16(bitPattern: scaled)
          +            bytes.append(UInt8(truncatingIfNeeded: bits))
          +            bytes.append(UInt8(truncatingIfNeeded: bits >> 8))
          +        }
          +        return Data(bytes)
          +    }
          +    static func resample(_ samples: [Float], from source: Double, to target: Double) -> [Float] {
          +        guard !samples.isEmpty, source.isFinite, target.isFinite, source > 0, target > 0 else { return [] }
          +        let count = Double(samples.count) * target / source
          +        guard count.isFinite, count >= 1, count <= 4_000_000 else { return [] }
          +        let ratio = source / target
          +        return (0..<Int(count)).map { i in
          +            let position = min(Double(samples.count - 1), Double(i) * ratio)
          +            let index = Int(position)
          +            let fraction = Float(position - Double(index))
          +            let next = min(index + 1, samples.count - 1)
          +            return samples[index] * (1 - fraction) + samples[next] * fraction
          +        }
          +    }
          +}
