          +import Foundation
          +
          +/// Presentation is independent of microphones and network clients, so every state is testable.
          +struct AssistantPresentation: Equatable {
          +    enum Phase: CaseIterable { case idle, connecting, listening, thinking, speaking, toolRunning, live }
          +    var phase: Phase = .idle
          +    var active = false
          +    var configured = false
          +    var wakeEnabled = true
          +    var microphoneReady = false
          +    var wakeWord = "Jarvis"
          +    var stopping = false
          +
          +    var canStop: Bool { active || phase == .connecting || stopping }
          +    var primaryEnabled: Bool { !stopping && (canStop || configured) }
          +    var primaryTitle: String { stopping ? "Durduruluyor…" : (canStop ? "Durdur" : "Konuşmaya başla") }
          +    var title: String {
          +        if stopping { return "Konuşma bitiriliyor" }
          +        if phase == .idle && !configured { return "Asistanı ayarla" }
          +        switch phase {
          +        case .idle:
          +            if wakeEnabled { return microphoneReady ? "\(wakeWord) hazır" : "Seslenme hazırlanıyor" }
          +            return "Konuşmaya hazır"
          +        case .connecting: return "Bağlanıyor"
          +        case .listening: return "Seni dinliyorum"
          +        case .thinking: return "Yanıt hazırlanıyor"
          +        case .speaking: return "Jarvis konuşuyor"
          +        case .toolRunning: return "İsteğin işleniyor"
          +        case .live: return "Konuşma açık"
          +        }
          +    }
          +    var subtitle: String {
          +        if stopping { return "Birazdan yeniden seslenebilirsin." }
          +        if phase == .idle && !configured { return "Ayarlar’dan kullanacağın asistanı yapılandır." }
          +        if phase == .idle && wakeEnabled && microphoneReady {
          +            return "“\(wakeWord)” de veya aşağıdaki düğmeye dokun."
          +        }
          +        if phase == .idle && wakeEnabled { return "Mikrofon hazırlanırken düğmeyle de başlayabilirsin." }
          +        if canStop { return "Bitirmek için “Dur” de veya Durdur’a dokun." }
          +        return "Sorunu sor; yanıtı gözlüğünden dinle."
          +    }
          +    var symbol: String {
          +        if stopping { return "stop.circle" }
          +        switch phase {
          +        case .idle: return configured ? "mic" : "slider.horizontal.3"
          +        case .connecting: return "network"
          +        case .listening, .live: return "waveform"
          +        case .thinking, .toolRunning: return "ellipsis.bubble"
          +        case .speaking: return "speaker.wave.2"
          +        }
          +    }
          +}
