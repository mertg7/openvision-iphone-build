          +import Foundation
          +
          +/// Pure rules shared by GPS updates and the UI; no network or microphone required.
          +struct GuidePolicy {
          +    private(set) var narratedIDs: Set<String> = []
          +    private(set) var lastNarration = Date.distantPast
          +    static func acceptsFix(age: TimeInterval, accuracy: Double, speed: Double) -> Bool {
          +        age.isFinite && age >= -5 && age <= 90 && accuracy.isFinite && accuracy >= 0 && accuracy <= 100
          +            && speed.isFinite && speed <= 3.5
          +    }
          +    func mayNarrate(id: String, distance: Double, now: Date, busy: Bool) -> Bool {
          +        !busy && distance.isFinite && distance >= 0 && distance <= 300
          +            && !narratedIDs.contains(id) && narratedIDs.count < 50
          +            && now.timeIntervalSince(lastNarration) >= 90
          +    }
          +    mutating func didNarrate(id: String, now: Date) {
          +        narratedIDs.insert(id)
          +        lastNarration = now
          +    }
          +    mutating func reset() { self = GuidePolicy() }
          +}
          +
          +struct GuidePlace: Identifiable, Equatable {
          +    let id: String
          +    let title: String
          +    let summary: String
          +    let latitude: Double
          +    let longitude: Double
          +    var sourceURL: URL { URL(string: "https://tr.wikipedia.org/?curid=\(id)")! }
          +}
          +
          +enum GuideSourceParser {
          +    static func places(from data: Data) throws -> [GuidePlace] {
          +        guard let root = try JSONSerialization.jsonObject(with: data) as? [String: Any],
          +              root["error"] == nil else { throw CocoaError(.coderReadCorrupt) }
          +        guard let query = root["query"] as? [String: Any] else { return [] }
          +        guard let pages = query["pages"] as? [[String: Any]] else { throw CocoaError(.coderReadCorrupt) }
          +        return pages.compactMap { page in
          +            guard let id = page["pageid"] as? Int, id > 0,
          +                  let title = page["title"] as? String, !title.isEmpty,
          +                  let extract = page["extract"] as? String,
          +                  let coordinates = page["coordinates"] as? [[String: Any]],
          +                  let coordinate = coordinates.first,
          +                  let lat = coordinate["lat"] as? Double, lat.isFinite, (-90...90).contains(lat),
          +                  let lon = coordinate["lon"] as? Double, lon.isFinite, (-180...180).contains(lon) else { return nil }
          +            let text = extract.trimmingCharacters(in: .whitespacesAndNewlines)
          +            guard !text.isEmpty else { return nil }
          +            return GuidePlace(id: String(id), title: title, summary: String(text.prefix(700)), latitude: lat, longitude: lon)
          +        }
          +    }
          +}
