          +import SwiftUI
          +
          +struct AssistantScreen: View {
          +    let presentation: AssistantPresentation
          +    let backend: String
          +    let glassesRegistered: Bool
          +    let glassesConnected: Bool
          +    let cameraActive: Bool
          +    let capturing: Bool
          +    let canRequestImage: Bool
          +    let userText: String
          +    let assistantText: String
          +    let showTranscripts: Bool
