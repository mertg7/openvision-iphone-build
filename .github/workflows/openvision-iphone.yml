          xcodegen generate
          xcrun swiftc -frontend -parse OpenVision/Views/VoiceAgent/VoiceAgentViewModel.swift
          xcrun swiftc -frontend -parse OpenVision/Views/VoiceAgent/VoiceAgentView.swift
