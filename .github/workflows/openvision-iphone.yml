          +import Foundation
          +
          +/// Live transcripts may arrive as word fragments or as a cumulative utterance.
          +/// Only explicit control phrases stop the session, not substrings ("durum", "stopwatch").
          +struct LiveStopCommand {
          +    private(set) var transcript = ""
          +    private var lastUpdate = Date.distantPast
          +
          +    mutating func reset() {
          +        transcript = ""
          +        lastUpdate = .distantPast
          +    }
          +
          +    mutating func consume(_ text: String, at now: Date = Date()) -> Bool {
          +        if now.timeIntervalSince(lastUpdate) > 4 { transcript = "" }
          +        lastUpdate = now
          +        if transcript.isEmpty || text.hasPrefix(transcript) {
          +            transcript = text
          +        } else {
          +            transcript += text
          +        }
          +        transcript = String(transcript.suffix(500))
          +        let normalized = transcript.lowercased(with: Locale(identifier: "tr_TR"))
          +            .folding(options: .diacriticInsensitive, locale: Locale(identifier: "en_US"))
          +            .replacingOccurrences(of: "ı", with: "i")
          +            .components(separatedBy: CharacterSet.alphanumerics.inverted)
          +            .filter { !$0.isEmpty }.joined(separator: " ")
          +        let exact = ["dur", "dur dur", "lutfen dur", "dur lutfen", "sus", "yeter",
          +                     "stop", "stop please", "please stop"]
          +        if exact.contains(normalized) { return true }
          +        let phrases = ["konusmayi durdur", "konusmayi bitir", "sohbeti bitir",
          +                       "videoyu durdur", "kamerayi kapat", "dinlemeyi durdur",
          +                       "stop video", "stop streaming", "stop live", "end video",
          +                       "exit video", "disable video", "stop the video", "end live",
          +                       "स्टॉप", "वीडियो बंद", "बंद करो", "रुको"]
          +        return phrases.contains { (" " + normalized + " ").contains(" " + $0 + " ") }
          +    }
          +}
