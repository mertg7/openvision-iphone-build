          +import XCTest
          +@testable import OpenVision
          +
          +final class AssistantSafetyTests: XCTestCase {
          +    @MainActor func testCancelledGeminiStartDoesNotOpenConnection() async {
          +        let service = GeminiLiveService.shared
          +        let before = service.connectionState
          +        let task = Task { try await service.connect() }
          +        task.cancel()
          +        do { try await task.value; XCTFail("Cancelled start must throw") }
          +        catch { XCTAssertTrue(error is CancellationError) }
          +        XCTAssertEqual(service.connectionState, before)
          +    }
          +    @MainActor func testCancelledOpenAIStartDoesNotOpenConnection() async {
          +        let service = OpenAIRealtimeService.shared
          +        let before = service.connectionState
          +        let task = Task { try await service.connect() }
          +        task.cancel()
          +        do { try await task.value; XCTFail("Cancelled start must throw") }
          +        catch { XCTAssertTrue(error is CancellationError) }
          +        XCTAssertEqual(service.connectionState, before)
          +    }
          +    func testEveryActivePhaseKeepsStopAvailable() {
          +        for phase in AssistantPresentation.Phase.allCases {
          +            let state = AssistantPresentation(phase: phase, active: true, configured: false)
          +            XCTAssertEqual(state.primaryTitle, "Durdur")
          +            XCTAssertTrue(state.primaryEnabled)
          +        }
          +    }
          +    func testSetupAndReadinessAreHonest() {
          +        var state = AssistantPresentation()
          +        XCTAssertEqual(state.title, "Asistanı ayarla")
          +        XCTAssertFalse(state.primaryEnabled)
          +        state.configured = true
          +        XCTAssertEqual(state.title, "Seslenme hazırlanıyor")
          +        state.microphoneReady = true
          +        XCTAssertEqual(state.title, "Jarvis hazır")
          +        state.stopping = true
          +        XCTAssertFalse(state.primaryEnabled)
          +        XCTAssertEqual(state.primaryTitle, "Durduruluyor…")
          +    }
          +    func testPCMEndpointsAndUnalignedInput() {
          +        let bytes = Data([0, 128, 0, 0, 255, 127])
          +        XCTAssertEqual(PCMCodec.decode(bytes), [-1, 0, 32767.0 / 32768.0])
          +        XCTAssertEqual(PCMCodec.encode([-2, 0, 2]), bytes)
          +        let prefixed = Data([77, 0, 128, 0, 0, 255, 127])
          +        XCTAssertEqual(PCMCodec.decode(Data(prefixed.dropFirst())), PCMCodec.decode(bytes))
          +        XCTAssertTrue(PCMCodec.decode(Data([0])).isEmpty)
          +        XCTAssertEqual(PCMCodec.encode([.nan, .infinity]), Data([0,0,0,0]))
          +    }
          +    func testResamplingPreservesSilenceAndConstantSignals() {
          +        XCTAssertEqual(PCMCodec.resample([0,0,0,0], from: 16000, to: 24000), [0,0,0,0,0,0])
          +        XCTAssertEqual(PCMCodec.resample([0.5,0.5], from: 16000, to: 24000), [0.5,0.5,0.5])
          +        XCTAssertTrue(PCMCodec.resample([], from: 16000, to: 24000).isEmpty)
          +        XCTAssertTrue(PCMCodec.resample([0], from: 0, to: 24000).isEmpty)
          +        XCTAssertTrue(PCMCodec.resample([0], from: .nan, to: 24000).isEmpty)
          +    }
          +}
