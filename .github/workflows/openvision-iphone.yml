name: OpenVision iPhone deneme derlemesi

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openvision-personal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Sabitlenmis OpenVision kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: rayl15/OpenVision
          ref: 1e88c3f21f4521c953bb8a1e4e60be865e3893b4
          persist-credentials: false

      - name: Derleme araclarini hazirla
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
          mkdir -p build

      - name: Native tasarim ve guvenlik kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          git apply --check <<'NATIVE_PATCH'
