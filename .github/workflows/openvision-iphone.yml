          +import AVFoundation
          +import Foundation
          +
          +/// One hardware tap, with a replaceable consumer. Swapping wake/live consumers
          +/// must not stop the microphone that was started while the app was foreground.
          +final class MicrophoneInputRouter: @unchecked Sendable {
          +    // Audio callbacks run off the UI actor; do not inherit its isolation at creation.
          +    typealias Sink = @Sendable (AVAudioPCMBuffer) -> Void
          +    private let lock = NSLock()
          +    private var sink: Sink?
          +
          +    func setSink(_ sink: Sink?) {
          +        lock.lock()
          +        self.sink = sink
          +        lock.unlock()
          +    }
          +
          +    func deliver(_ buffer: AVAudioPCMBuffer) {
          +        lock.lock()
          +        let current = sink
          +        lock.unlock()
          +        current?(buffer)
          +    }
          +
          +    /// Copy samples before leaving the audio callback; AVAudioEngine reuses its buffer.
          +    static func monoSamples(from buffer: AVAudioPCMBuffer) -> [Float] {
          +        guard let channels = buffer.floatChannelData, buffer.frameLength > 0,
          +              buffer.format.channelCount > 0 else { return [] }
          +        let frames = Int(buffer.frameLength)
          +        let count = Int(buffer.format.channelCount)
          +        var result = [Float](repeating: 0, count: frames)
          +        for channel in 0..<count {
          +            for frame in 0..<frames {
          +                let value = buffer.format.isInterleaved
          +                    ? channels[0][frame * count + channel] : channels[channel][frame]
          +                result[frame] += value / Float(count)
          +            }
          +        }
          +        return result
          +    }
          +}
