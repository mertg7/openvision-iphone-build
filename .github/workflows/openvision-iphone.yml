                  for phrase in ["dur", "DUR!", "Lütfen dur.", "Konuşmayı bitir", "konuşmayı durdur",
                                 "kamerayı kapat", "Stop video", "please stop streaming",
                                 "arkadaki sesler dur yeter artık", "Bir dur bakalım ne olmuş"] {
                      var matcher = LiveStopCommand()
