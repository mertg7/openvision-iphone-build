          +import Foundation
          +
          +enum PCMCodec {
          +    static func decode(_ data: Data) -> [Float] {
          +        guard !data.isEmpty, data.count.isMultiple(of: 2) else { return [] }
          +        let bytes = Array(data)
          +        return stride(from: 0, to: bytes.count, by: 2).map { i in
          +            let bits = UInt16(bytes[i]) | (UInt16(bytes[i + 1]) << 8)
          +            return Float(Int16(bitPattern: bits)) / 32768
          +        }
          +    }
          +    static func encode(_ samples: [Float]) -> Data {
          +        var bytes = [UInt8]()
          +        bytes.reserveCapacity(samples.count * 2)
          +        for sample in samples {
          +            let safe = sample.isFinite ? max(-1, min(1, sample)) : 0
          +            let scaled = Int16(max(-32768, min(32767, Int(safe * 32768))))
          +            let bits = UInt16(bitPattern: scaled)
          +            bytes.append(UInt8(truncatingIfNeeded: bits))
          +            bytes.append(UInt8(truncatingIfNeeded: bits >> 8))
          +        }
          +        return Data(bytes)
          +    }
          +    static func resample(_ samples: [Float], from source: Double, to target: Double) -> [Float] {
          +        guard !samples.isEmpty, source.isFinite, target.isFinite, source > 0, target > 0 else { return [] }
          +        let count = Double(samples.count) * target / source
          +        guard count.isFinite, count >= 1, count <= 4_000_000 else { return [] }
          +        let ratio = source / target
          +        return (0..<Int(count)).map { i in
          +            let position = min(Double(samples.count - 1), Double(i) * ratio)
          +            let index = Int(position)
          +            let fraction = Float(position - Double(index))
          +            let next = min(index + 1, samples.count - 1)
          +            return samples[index] * (1 - fraction) + samples[next] * fraction
          +        }
          +    }
          +}
