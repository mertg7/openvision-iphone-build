          import AVFoundation
          import Foundation
          
          @main
          struct MicrophoneRouterTests {
              final class Counter: @unchecked Sendable {
                  private let lock = NSLock()
                  private var stored = 0
                  func increment() { lock.lock(); stored += 1; lock.unlock() }
                  var value: Int { lock.lock(); defer { lock.unlock() }; return stored }
              }
              @MainActor static func main() {
                  let format = AVAudioFormat(standardFormatWithSampleRate: 48000, channels: 2)!
                  let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: 3)!
                  buffer.frameLength = 3
                  let data = buffer.floatChannelData!
                  data[0][0] = 1; data[0][1] = -1; data[0][2] = 0.5
                  data[1][0] = -1; data[1][1] = 1; data[1][2] = 0.5
                  let samples = MicrophoneInputRouter.monoSamples(from: buffer)
                  precondition(samples == [0, 0, 0.5])
                  data[0][2] = 0
                  precondition(samples[2] == 0.5, "Samples must survive native buffer reuse")
          
                  let router = MicrophoneInputRouter()
                  let wakeFrames = Counter()
                  let liveFrames = Counter()
                  router.setSink { _ in wakeFrames.increment() }
                  router.deliver(buffer)
                  router.setSink { _ in liveFrames.increment() }
                  router.deliver(buffer)
                  precondition(wakeFrames.value == 1 && liveFrames.value == 1, "Exclusive wake/live routing")
                  router.setSink(nil)
                  router.deliver(buffer)
                  precondition(wakeFrames.value == 1 && liveFrames.value == 1, "Pause must not forward audio")
                  router.setSink { _ in
                      wakeFrames.increment()
                      router.setSink(nil) // Reentrant teardown must not deadlock.
                  }
                  router.deliver(buffer)
                  router.deliver(buffer)
                  precondition(wakeFrames.value == 2 && liveFrames.value == 1)
                  buffer.frameLength = 0
                  precondition(MicrophoneInputRouter.monoSamples(from: buffer).isEmpty)
                  router.setSink { _ in wakeFrames.increment() }
                  let done = DispatchSemaphore(value: 0)
                  DispatchQueue.global().async {
                      let f = AVAudioFormat(standardFormatWithSampleRate: 16000, channels: 1)!
                      let b = AVAudioPCMBuffer(pcmFormat: f, frameCapacity: 1)!
                      b.frameLength = 1
                      b.floatChannelData![0][0] = 0
                      router.deliver(b)
                      done.signal()
                  }
                  precondition(done.wait(timeout: .now() + 3) == .success)
                  precondition(wakeFrames.value == 3, "Audio-thread delivery must not require the UI actor")
                  print("PASS: one input routed wake/live/wake, pause, reentrant detach, copied stereo/empty samples")
                  print("PASS: UI-created consumer safely receives audio on a background thread")
              }
          }
          MICROPHONE_ROUTER_TESTS
          xcrun swiftc -parse-as-library OpenVision/Services/Audio/MicrophoneInputRouter.swift build/microphone_router_tests.swift -o build/MICROPHONE_ROUTER_TESTS
          ./build/MICROPHONE_ROUTER_TESTS

      - name: Kisisel deneme ayarlari
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import shutil

          root = pathlib.Path.cwd()
          identifier = 'app.personal.openvision.r' + os.environ['REPOSITORY_ID']
          root.joinpath('Config.xcconfig').write_text(
              'DEVELOPMENT_TEAM =\n'
              f'PRODUCT_BUNDLE_IDENTIFIER = {identifier}\n'
              'META_APP_ID = 0\n'
              'CLIENT_TOKEN =\n'
              'APP_LINK_URL_SCHEME = openvision\n', encoding='utf-8')
          shutil.copyfile(root / 'OpenVision/Config/Config.swift.example',
                          root / 'OpenVision/Config/Config.swift')

          # Personal signing may not support increased-memory-limit. This build
          # targets the cloud OpenAI backend; avoid memory-heavy local models.
          entitlement = root / 'OpenVision/OpenVision.entitlements'
          entitlement.write_bytes(plistlib.dumps({}))
          settings = root / 'OpenVision/Models/AppSettings.swift'
          source = settings.read_text(encoding='utf-8')
          original = 'var aiBackend: AIBackendType = .openClaw'
          if source.count(original) != 1:
              raise SystemExit('Unexpected upstream settings; review before building.')
          settings.write_text(source.replace(original,
                              'var aiBackend: AIBackendType = .openAI'), encoding='utf-8')

          # MLX's optional FoundationModels adapter targets a different Apple
          # API revision. OpenVision uses its own Apple service and does not
          # need this adapter. Explicit empty traits disable package defaults.
          project = root / 'project.yml'
          specification = project.read_text(encoding='utf-8')
          pin = '    revision: "68947ccdca79bcf7a26dc220f73caa060369513c"'
          if specification.count(pin) != 1:
              raise SystemExit('Unexpected MLX package pin; review before building.')
          project.write_text(specification.replace(pin, pin + '\n    traits: []'), encoding='utf-8')

          # Use the glasses for the actual test. No API keys, Apple passwords,
          # developer certificates or user data are embedded in this build.
          info = root / 'OpenVision/Resources/Info.plist'
          data = plistlib.loads(info.read_bytes())
          data['UIRequiredDeviceCapabilities'] = ['arm64', 'microphone']
          info.write_bytes(plistlib.dumps(data))
          PY
          xcodegen generate

      - name: iPhone uygulamasini imzasiz derle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -jobs 2 \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=6 \
            MARKETING_VERSION=3.0.0 \
            build 2>&1 | tee build/xcodebuild.log

      - name: Simulator unit ve arayuz testleri
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/simulators.json
          SIM_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('build/simulators.json'))
          candidates=[d for group in data['devices'].values() for d in group if d['isAvailable'] and 'iPhone' in d['name']]
          assert candidates, 'No iPhone simulator available'
          preferred=[d for d in candidates if 'Pro Max' in d['name']]
          print((preferred or candidates)[0]['udid'])
          PY
          )
          set +e
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/SimulatorData \
            -resultBundlePath build/NativeTests.xcresult \
            -jobs 2 \
            -parallel-testing-enabled NO \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=6 \
            MARKETING_VERSION=3.0.0 \
            test 2>&1 | tee build/simulator-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          xcrun xcresulttool export attachments --path build/NativeTests.xcresult --output-path build/InterfaceScreenshots || true
          xcrun xcresulttool get test-results summary --path build/NativeTests.xcresult > build/test-summary.json || true
          exit "$TEST_STATUS"

      - name: Windows icin IPA dosyasini paketle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/OpenVision.app'
          test -f "$APP_PATH/OpenVision"
          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/OpenVision.app
          ditto -c -k --keepParent build/package/Payload build/OpenVision-unsigned.ipa
          shasum -a 256 build/OpenVision-unsigned.ipa > build/SHA256.txt
          printf '%s\n' \
            'Unsigned personal test build. Sign/install locally with Sideloadly.' \
            'No Apple password or OpenAI key is included.' \
            'Meta developer mode is required. Camera connection has not been tested.' \
            'Use the OpenAI backend, not large on-device MLX models.' \
            > build/READ-FIRST.txt
          printf '%s\n' \
            '### OpenVision derlemesi tamamlandi' \
            'Dosyalar asagidaki OpenVision-iPhone-deneme ekindedir.' \
            'Native arayuz ve unit testleri simulator uzerinde gecti. Gercek gozluk, Bluetooth ve kilit ekrani cihaz testi bekleniyor.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: IPA dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-iPhone-deneme
          path: |
            build/OpenVision-unsigned.ipa
            build/SHA256.txt
            build/READ-FIRST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Hata incelemesi icin derleme kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-derleme-kaydi
          path: |
            build/xcodebuild.log
            build/simulator-tests.log
            build/NativeTests.xcresult
            build/InterfaceScreenshots
            build/test-summary.json
            OpenVision.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 14
