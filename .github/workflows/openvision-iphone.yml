          +        CityGuideService.shared.stop()
          +        let result = try await CityGuideTool().execute(args: [:])
          +        XCTAssertTrue(result.contains("kapalı"))
          +        XCTAssertTrue(CityGuideService.shared.places.isEmpty)
          +    }
          +}
