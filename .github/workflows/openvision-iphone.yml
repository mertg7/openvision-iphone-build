          +    let requestImage: () -> Void
          +    let dismissError: () -> Void
          +    var dismissDocument: () -> Void = {}
          +
          +    var body: some View {
          +        ScrollView {
          +            VStack(alignment: .leading, spacing: 24) {
          +                HStack(alignment: .top) {
          +                    Label(backend, systemImage: "sparkles")
          +                    Spacer(minLength: 16)
          +                    Label(glassesConnected ? "Bağlı" : (glassesRegistered ? "Kayıtlı" : "Gözlük ekle"),
          +                          systemImage: "eyeglasses")
          +                }
          +                .font(.subheadline).foregroundStyle(.secondary)
          +                .accessibilityIdentifier("assistant.connection")
          +
          +                VStack(spacing: 16) {
          +                    Image(systemName: presentation.symbol)
          +                        .font(.system(size: 48, weight: .regular))
          +                        .foregroundStyle(presentation.canStop ? Color.blue : Color.secondary)
          +                        .frame(width: 100, height: 100)
          +                        .background(Color.blue.opacity(0.08), in: Circle())
          +                        .accessibilityHidden(true)
          +                    Text(presentation.title)
          +                        .font(.title2.weight(.semibold)).multilineTextAlignment(.center)
          +                        .accessibilityIdentifier("assistant.status")
          +                    Text(presentation.subtitle)
          +                        .font(.body).foregroundStyle(.secondary).multilineTextAlignment(.center)
          +                    if presentation.phase == .connecting || presentation.stopping {
          +                        ProgressView().accessibilityLabel(presentation.title)
          +                    }
          +                }
          +                .frame(maxWidth: .infinity).padding(.vertical, 20)
          +
          +                if let error {
          +                    VStack(alignment: .leading, spacing: 12) {
          +                        Label("Bir sorun oluştu", systemImage: "exclamationmark.triangle")
          +                            .font(.headline).foregroundStyle(.red)
          +                        Text(error).font(.body).textSelection(.enabled)
          +                        Button("Uyarıyı kapat", action: dismissError)
          +                            .frame(minHeight: 44).accessibilityIdentifier("assistant.dismissError")
          +                    }
          +                    .frame(maxWidth: .infinity, alignment: .leading)
          +                    .padding(16).background(Theme.bgElevated, in: RoundedRectangle(cornerRadius: 16))
          +                    .accessibilityIdentifier("assistant.error")
          +                }
          +
          +                if let documentTitle {
          +                    Button(action: dismissDocument) {
          +                        Label("\(documentTitle) · Kapat", systemImage: "book.closed")
          +                            .frame(maxWidth: .infinity, minHeight: 44, alignment: .leading)
          +                    }
          +                }
          +
          +                if showTranscripts && (!userText.isEmpty || !assistantText.isEmpty) {
          +                    VStack(alignment: .leading, spacing: 20) {
          +                        if !userText.isEmpty { transcript("Sen", text: userText) }
          +                        if !assistantText.isEmpty { transcript("Jarvis", text: assistantText) }
          +                    }
          +                    .padding(20).frame(maxWidth: .infinity, alignment: .leading)
          +                    .background(Theme.bgElevated, in: RoundedRectangle(cornerRadius: 16))
          +                    .accessibilityIdentifier("assistant.transcript")
          +                }
          +
          +                Label(cameraActive ? "Kamera açık" : "Kamera kapalı", systemImage: cameraActive ? "video" : "video.slash")
          +                    .font(.subheadline).foregroundStyle(.secondary)
          +                    .accessibilityIdentifier("assistant.camera")
          +                Text("Kamera görüntü istediğinde açılır. Gözlüğün ışığı, kameranın açık olduğunu gösterir.")
          +                    .font(.footnote).foregroundStyle(.secondary)
          +            }
          +            .padding(20).frame(maxWidth: 600).frame(maxWidth: .infinity)
          +        }
          +        .background(Theme.bg)
          +        .safeAreaInset(edge: .bottom, spacing: 0) {
          +            VStack(spacing: 10) {
          +                if canRequestImage {
          +                    Button(action: requestImage) {
          +                        Label(capturing ? "Görüntü alınıyor…" : "Ne görüyorsun?", systemImage: "camera")
          +                            .frame(maxWidth: .infinity, minHeight: 44)
          +                    }
          +                    .buttonStyle(.bordered).disabled(capturing || presentation.stopping)
          +                    .accessibilityIdentifier("assistant.capture")
          +                }
          +                Button(action: toggleSession) {
          +                    Label(presentation.primaryTitle, systemImage: presentation.canStop ? "stop.fill" : "mic.fill")
          +                        .font(.headline).frame(maxWidth: .infinity, minHeight: 44)
          +                }
          +                .buttonStyle(.borderedProminent)
          +                .tint(presentation.canStop ? .red : .blue)
          +                .disabled(!presentation.primaryEnabled)
          +                .accessibilityIdentifier("assistant.primary")
          +            }
          +            .padding(.horizontal, 20).padding(.vertical, 12)
          +            .frame(maxWidth: 600).frame(maxWidth: .infinity)
          +            .background(.bar)
          +        }
          +    }
          +
          +    private func transcript(_ speaker: String, text: String) -> some View {
          +        VStack(alignment: .leading, spacing: 6) {
          +            Text(speaker).font(.subheadline.weight(.semibold)).foregroundStyle(.secondary)
          +            Text(text).font(.body).textSelection(.enabled).fixedSize(horizontal: false, vertical: true)
          +        }.accessibilityElement(children: .combine)
          +    }
          +}
