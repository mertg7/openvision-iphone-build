          +import XCTest
          +@testable import OpenVision
          +
          +final class GuideSafetyTests: XCTestCase {
          +    func testBadOrOldGPSNeverEnablesNarration() {
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: 91, accuracy: 20, speed: 1))
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: -6, accuracy: 20, speed: 1))
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: 1, accuracy: -1, speed: 1))
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: 1, accuracy: .nan, speed: 1))
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: 1, accuracy: 120, speed: 1))
          +        XCTAssertFalse(GuidePolicy.acceptsFix(age: 1, accuracy: 10, speed: 10))
          +        XCTAssertTrue(GuidePolicy.acceptsFix(age: 1, accuracy: 10, speed: -1))
          +    }
          +    func testNarrationWaitsForSilenceDistanceAndCooldown() {
          +        var policy = GuidePolicy()
          +        let now = Date()
          +        XCTAssertFalse(policy.mayNarrate(id: "a", distance: 20, now: now, busy: true))
          +        XCTAssertFalse(policy.mayNarrate(id: "a", distance: .infinity, now: now, busy: false))
          +        XCTAssertFalse(policy.mayNarrate(id: "a", distance: 301, now: now, busy: false))
          +        XCTAssertTrue(policy.mayNarrate(id: "a", distance: 20, now: now, busy: false))
          +        policy.didNarrate(id: "a", now: now)
          +        XCTAssertFalse(policy.mayNarrate(id: "a", distance: 20, now: now.addingTimeInterval(100), busy: false))
          +        XCTAssertFalse(policy.mayNarrate(id: "b", distance: 20, now: now.addingTimeInterval(89), busy: false))
          +        XCTAssertTrue(policy.mayNarrate(id: "b", distance: 20, now: now.addingTimeInterval(90), busy: false))
          +        policy.reset()
          +        XCTAssertTrue(policy.mayNarrate(id: "a", distance: 20, now: now, busy: false))
          +    }
          +    func testSourceParserRejectsMissingCoordinatesEmptyAndInvalidData() throws {
          +        let data = Data(#"{"query":{"pages":[{"pageid":1,"title":"Kule","extract":"Kaynak metni.","coordinates":[{"lat":41.0,"lon":29.0}]},{"pageid":2,"title":"Koordinatsız","extract":"Tahmin etme"},{"pageid":3,"title":"Hatalı","extract":"Metin","coordinates":[{"lat":200.0,"lon":29.0}]}]}}"#.utf8)
          +        let places = try GuideSourceParser.places(from: data)
          +        XCTAssertEqual(places.count, 1)
          +        XCTAssertEqual(places[0].title, "Kule")
          +        XCTAssertEqual(places[0].sourceURL.host, "tr.wikipedia.org")
          +        XCTAssertEqual(try GuideSourceParser.places(from: Data("{}".utf8)), [])
          +        XCTAssertThrowsError(try GuideSourceParser.places(from: Data(#"{"error":{"code":"badvalue"}}"#.utf8)))
          +        XCTAssertThrowsError(try GuideSourceParser.places(from: Data("not json".utf8)))
          +    }
