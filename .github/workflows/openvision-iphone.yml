          +            transcript += text
          +        }
          +        transcript = String(transcript.suffix(500))
          +        let normalized = transcript.lowercased(with: Locale(identifier: "tr_TR"))
          +            .folding(options: .diacriticInsensitive, locale: Locale(identifier: "en_US"))
          +            .replacingOccurrences(of: "ı", with: "i")
          +            .components(separatedBy: CharacterSet.alphanumerics.inverted)
          +            .filter { !$0.isEmpty }.joined(separator: " ")
          +        let exact = ["dur", "dur dur", "lutfen dur", "dur lutfen", "sus", "yeter",
          +                     "stop", "stop please", "please stop"]
          +        if exact.contains(normalized) { return true }
          +        let phrases = ["konusmayi durdur", "konusmayi bitir", "sohbeti bitir",
          +                       "videoyu durdur", "kamerayi kapat", "dinlemeyi durdur",
          +                       "stop video", "stop streaming", "stop live", "end video",
          +                       "exit video", "disable video", "stop the video", "end live",
          +                       "स्टॉप", "वीडियो बंद", "बंद करो", "रुको"]
          +        return phrases.contains { (" " + normalized + " ").contains(" " + $0 + " ") }
          +    }
          +}
          WAKE_PATCH
          xcodegen generate
          xcrun swiftc -frontend -parse OpenVision/Views/VoiceAgent/VoiceAgentViewModel.swift
          xcrun swiftc -frontend -parse OpenVision/Views/VoiceAgent/VoiceAgentView.swift
          xcrun swiftc -frontend -parse OpenVision/Services/GeminiLive/GeminiLiveService.swift
          xcrun swiftc -frontend -parse OpenVision/Services/Voice/LiveStopCommand.swift
          cat > build/live-control-tests.swift <<'LIVE_TESTS'
          import Foundation
          
          @main
          struct LiveControlTests {
              static func main() {
                  for phrase in ["dur", "DUR!", "Lütfen dur.", "Konuşmayı bitir", "konuşmayı durdur",
                                 "kamerayı kapat", "Stop video", "please stop streaming"] {
                      var matcher = LiveStopCommand()
                      precondition(matcher.consume(phrase), "Missed control: \(phrase)")
                  }
                  for phrase in ["durum nasıl", "durdurma", "stopwatch",
                                 "Durak nerede?", "Bir dur bakalım ne olmuş", "konuşmayı bitirme"] {
                      var matcher = LiveStopCommand()
                      precondition(!matcher.consume(phrase), "False stop: \(phrase)")
                  }
                  var matcher = LiveStopCommand()
                  precondition(!matcher.consume("konuş"))
                  precondition(matcher.consume("mayı bitir"))
                  matcher.reset()
                  precondition(!matcher.consume("please "))
                  precondition(matcher.consume("stop video"))
                  matcher.reset()
                  precondition(!matcher.consume("kamerayı"))
                  precondition(matcher.consume("kamerayı kapat"))
                  matcher.reset()
                  let now = Date()
                  precondition(!matcher.consume("konuşmayı ", at: now))
                  precondition(!matcher.consume("bitir", at: now.addingTimeInterval(5)))
                  print("PASS: Turkish / English commands, fragments, cumulative text, false matches, and expiry")
              }
          }
          LIVE_TESTS
          xcrun swiftc -parse-as-library OpenVision/Services/Voice/LiveStopCommand.swift build/live-control-tests.swift -o build/live-control-tests
          ./build/live-control-tests

      - name: iPhone uygulamasini imzasiz derle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -jobs 2 \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION=3 \
            build 2>&1 | tee build/xcodebuild.log

      - name: Windows icin IPA dosyasini paketle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/OpenVision.app'
          test -f "$APP_PATH/OpenVision"
          mkdir -p build/package/Payload
          ditto "$APP_PATH" build/package/Payload/OpenVision.app
          ditto -c -k --keepParent build/package/Payload build/OpenVision-unsigned.ipa
          shasum -a 256 build/OpenVision-unsigned.ipa > build/SHA256.txt
          printf '%s\n' \
            'Unsigned personal test build. Sign/install locally with Sideloadly.' \
            'No Apple password or OpenAI key is included.' \
            'Meta developer mode is required. Camera connection has not been tested.' \
            'Use the OpenAI backend, not large on-device MLX models.' \
            > build/READ-FIRST.txt
          printf '%s\n' \
            '### OpenVision derlemesi tamamlandi' \
            'Dosyalar asagidaki OpenVision-iPhone-deneme ekindedir.' \
            'Bu sonuc kamera, mikrofon veya iOS 27 cihaz testinin gectigi anlamina gelmez.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: IPA dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-iPhone-deneme
          path: |
            build/OpenVision-unsigned.ipa
            build/SHA256.txt
            build/READ-FIRST.txt
          if-no-files-found: error
          retention-days: 3

      - name: Hata incelemesi icin derleme kaydini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-derleme-kaydi
          path: |
            build/xcodebuild.log
            OpenVision.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 3
